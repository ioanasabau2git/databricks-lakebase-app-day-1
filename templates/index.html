<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Massive Stock Watchlist</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 640px;
      margin: 48px auto;
      padding: 0 20px;
      color: #1a1d21;
      background: linear-gradient(180deg, #eef4ff 0%, #ffffff 55%, #f6f9ff 100%);
      min-height: 100vh;
      animation: fade-in 0.4s ease-out;
    }
    @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin: 0 0 6px; }
    .hint { color: #5f6b7a; font-size: 14px; line-height: 1.5; margin: 0; }
    #stock-form {
      background: #ffffff;
      border: 1px solid #e6ecf5;
      border-radius: 16px;
      padding: 24px;
      margin-top: 24px;
      box-shadow: 0 4px 24px rgba(24, 46, 92, 0.07);
    }
    label { display: block; margin-top: 0; font-weight: 600; font-size: 14px; color: #333a45; }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      margin-top: 8px;
      font-size: 15px;
      border: 1px solid #d6dce8;
      border-radius: 10px;
      background: #fbfcfe;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #3b82f6;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }
    button {
      margin-top: 16px;
      padding: 12px 22px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(135deg, #2f6bff 0%, #22c1dc 100%);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(47, 107, 255, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.05); box-shadow: 0 6px 18px rgba(47, 107, 255, 0.45); }
    button:active { transform: translateY(0); }
    #result {
      margin-top: 18px;
      white-space: pre-wrap;
      background: #eef6ff;
      border: 1px solid #d6e8ff;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      color: #274b77;
      min-height: 20px;
    }
    table {
      width: 100%;
      margin-top: 28px;
      background: #ffffff;
      border-collapse: separate;
      border-spacing: 0;
      border: 1px solid #e6ecf5;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(24, 46, 92, 0.07);
      font-size: 14px;
    }
    th, td { text-align: left; padding: 12px 16px; }
    th {
      font-size: 11px;
      font-weight: 700;
      color: #7c8798;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: #f7f9fd;
      border-bottom: 1px solid #e6ecf5;
    }
    td { border-bottom: 1px solid #f0f3f8; color: #333a45; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.12s ease; }
    tbody tr:hover { background: #f5f9ff; }
  </style>
</head>
<body>
  <h1>Stock Watchlist</h1>
  <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

  <form id="stock-form">
    <label for="symbol">Ticker symbol</label>
    <input type="text" id="symbol" name="symbol" placeholder="AAPL" required>
    <button type="submit">Add to watchlist</button>
  </form>

  <div id="result"></div>

  <table id="watchlist-table">
    <thead>
      <tr>
        <th>Symbol</th>
        <th>Email</th>
        <th>Latest price</th>
        <th>Updated</th>
      </tr>
    </thead>
    <tbody id="watchlist-body"></tbody>
  </table>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          return;
        }
        watchlistBody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `<td>${row.symbol}</td><td>${row.email || "-"}</td><td>${price}</td><td>${updated}</td>`;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        resultEl.textContent = "Failed to load watchlist: " + err;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      resultEl.textContent = "Adding to watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.textContent = "Added " + data.symbol + " at price " + data.latest_price;
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
